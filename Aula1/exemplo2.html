<!DOCTYPE html>
<html lang="pt-BR">

    <head>
        <meta charset="UTF-8">

        <meta name="viewport"
            content="width=device-width, initial-scale=1.0">

        <title>HzTeam</title>
    </head>

    <body style="font-family: Arial, sans-serif;
             background-color: #f2f2f2;
             margin: 0;
             text-align: center;">

        <header style="background-color: #222;
                   color: white;
                   padding: 30px;">

            <h1 style="color: #00e88f;">
                Olá, Desenvolvedor!
            </h1>
            <p style="font-size: 18px;">
                Você está fazendo parte da equipe HzTeam.
            </p>
        </header>
        <main style="background-color: white;
                 width: 80%;
                 max-width: 800px;
                 margin: 30px auto;
                 padding: 30px;
                 border-radius: 15px;
                 box-shadow: 0 4px 10px rgba(0,0,0,0.2);">
            <h2 style="color: #333;">
                Bem-vindo!
            </h2>
            <p style="color: #555;
                  font-size: 16px;
                  line-height: 1.6;">
                Aprenda mais sobre desenvolvimento de jogos clicando no botão
                abaixo.
            </p>
            <button
                onclick="window.location.href='https://gamedevweb.vercel.app/'"
                style="background-color: #00e88f;
                   color: #111;
                   border: none;
                   padding: 15px 30px;
                   font-size: 16px;
                   font-weight: bold;
                   border-radius: 8px;
                   cursor: pointer;">
                &#127918; Acessar GameDevWeb
            </button>
        </main>
        <footer style="background-color: #222;
                   color: white;
                   padding: 20px;
                   margin-top: 30px;">
            <p>
                Curso de HTML5 - 2026
            </p>
        </footer>
    </body>
</html>
