<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport"
            content="width=device-width, initial-scale=1.0">
        <title>HzTeam</title>
        <!-- CSS INTERNO -->
        <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            text-align: center;
        }
        header {
            background-color: #222;
            color: white;
            padding: 30px;
        }
        header h1 {
            color: #00e88f;
        }
        header p {
            font-size: 18px;
        }
        main {
            background-color: white;
            width: 80%;
            max-width: 800px;
            margin: 30px auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }
        main h2 {
            color: #333;
        }
        main p {
            color: #555;
            font-size: 16px;
            line-height: 1.6;
        }
        button {
            background-color: #00e88f;
            color: #111;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }
        button:hover {
            background-color: #00c878;
        }
        footer {
            background-color: #222;
            color: white;
            padding: 20px;
            margin-top: 30px;
        }
    </style>
    </head>
    <body>
        <header>
            <h1>Olá, Desenvolvedor!</h1>
            <p>
                Você está fazendo parte da equipe HzTeam.

            </p>
        </header>
        <main>
            <h2>Bem-vindo!</h2>
            <p>
                Aprenda mais sobre desenvolvimento de jogos clicando no botão
                abaixo.

            </p>
            <button
                onclick="window.location.href='https://gamedevweb.vercel.app/'">
                &#127918; Acessar GameDevWeb
            </button>
        </main>
        <footer>
            <p>
                Curso de HTML5 - 2026
            </p>
        </footer>
    </body>
</html>
